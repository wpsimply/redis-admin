# Redis Simply behind nginx. Only public/ is served; src/, storage/, .env and
# config.php sit outside the document root.
server {
    listen 443 ssl;
    http2 on;
    server_name redis.example.com;

    ssl_certificate     /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;

    # Browsers only ever reach this host over HTTPS, so the session cookies
    # and sign-on links never cross the network in the clear.
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/redis-simply/public;
    index index.php;

    # Imports are uploaded as a single file.
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(index|sso|api|export|import|logout)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/redis-simply.sock;
        # Exports stream; let them.
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
