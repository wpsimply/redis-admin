; A dedicated PHP-FPM pool for Redis Simply, e.g. /etc/php/8.3/fpm/pool.d/redis-simply.conf
[redis-simply]
user = www-data
group = www-data
listen = /run/php/redis-simply.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M

; Installed as a Composer dependency, keep .env, config.php and storage/
; outside vendor/, which every update replaces.
; env[REDIS_SIMPLY_HOME] = /etc/redis-simply

; Configuration can be passed as environment variables instead of .env.
; env[REDIS_SIMPLY_SOCKET] = /run/redis-simply/{target}.sock
; env[REDIS_SIMPLY_PANEL_URL] = https://panel.example.com
