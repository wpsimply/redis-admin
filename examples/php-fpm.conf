; A dedicated PHP-FPM pool for Redis Admin, e.g. /etc/php/8.3/fpm/pool.d/redis-admin.conf
[redis-admin]
user = www-data
group = www-data
listen = /run/php/redis-admin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M

; Configuration can be passed as environment variables instead of .env.
; env[REDIS_ADMIN_SOCKET] = /run/redis-admin/{target}.sock
; env[REDIS_ADMIN_PANEL_URL] = https://panel.example.com
